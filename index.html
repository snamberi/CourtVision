      <h1>Court Vision: a free basketball GM and simulation game</h1>
      <p>Run a basketball franchise in your browser: draft, trade, sign, coach and play every game possession by possession. Free, no download, no account needed.</p>
      <h2>Game modes</h2>
      <ul>
        <li><a href="/guides/82-0-challenge.html">82-0 Challenge</a> (5-10 min): build a ten-man team from all of NBA history and try to go 82-0, then 16-0 in the playoffs.</li>
        <li><a href="/guides/career-mode.html">Career Mode</a> (5-15 min): create one player and live his whole career, to the Hall of Fame.</li>
        <li><a href="/guides/rebuild-challenge.html">Rebuild Challenge</a> (10-20 min): take over a real team at its lowest point and win a title.</li>
        <li><a href="/guides/all-time-draft.html">All-Time Draft</a> (10-20 min): thirty teams draft every player in history at his best.</li>
        <li><a href="/guides/league-hunt.html">League Hunt</a> (15-30 min): spin a squad and beat ten great teams from every era.</li>
        <li><a href="/guides/real-nba-history.html">Real League</a>: run a real NBA franchise from any season since 1946-47.</li>
        <li>Random Players: a generated league for pure franchise building.</li>
      </ul>
      <p>Court Vision needs JavaScript to play. Read more: <a href="/about.html">About</a> · <a href="/how-to-play.html">How to Play</a> · <a href="/guides/">Guides</a> · <a href="/faq.html">FAQ</a> · <a href="/changelog.html">Changelog</a> · <a href="/privacy.html">Privacy Policy</a></p>
